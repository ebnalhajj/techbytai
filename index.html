<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>techbytai | Luxury AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap');
        
        body { 
            margin: 0; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #000; 
            color: #f5f5f7; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            overflow: hidden;
        }
        .container { text-align: center; padding: 20px; animation: fadeIn 1.2s ease-out; }
        h1 { font-size: 80px; font-weight: 600; margin: 0; letter-spacing: -0.03em; }
        p { font-size: 24px; color: #86868b; margin: 20px 0 40px; max-width: 500px; }
        .btn { 
            background: #fff; color: #000; padding: 14px 35px; 
            border-radius: 980px; text-decoration: none; font-size: 18px; 
            font-weight: 600; transition: all 0.4s ease;
            display: inline-block;
        }
        .btn:hover { background: #0071e3; color: #fff; transform: translateY(-3px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>techbytai</h1>
        <p>مستقبل التقنية، مصمم بدقة متناهية ليناسب تطلعاتك.</p>
        <a href="#" class="btn">استكشف المشاريع</a>
    </div>
</body>
</html>
